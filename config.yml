bundle:
  name: source_system_ingestion_demo

source_system:
  type: unity_catalog_volume
  catalog: classic_stable_dankeeling_catalog
  schema: config-driven-pipelines-demo
  volume: landing
  format: json

targets:
  dev:
    catalog: classic_stable_dankeeling_catalog
    schema: config-driven-pipelines-demo-dev
    schedule_pause_status: PAUSED
  prod:
    catalog: classic_stable_dankeeling_catalog
    schema: config-driven-pipelines-demo
    schedule_pause_status: UNPAUSED

workflows:
  - name: customers_ingestion
    pipeline:
      resource_key: customers_pipeline
      display_name: Customers ingestion
      tables:
        bronze:
          name: bronze_customers
          type: streaming_table
          description: Raw customer records
          source:
            path: customers
            schema_hints: customer_id STRING, first_name STRING, last_name STRING, email STRING, created_at TIMESTAMP
            options:
              cloudFiles.includeExistingFiles: true
              cloudFiles.schemaEvolutionMode: addNewColumns
        silver:
          name: silver_customers
          type: streaming_table
          description: Cleansed customer master data
          reads_from: bronze_customers
          select:
            - trim(customer_id) AS customer_id
            - initcap(trim(first_name)) AS first_name
            - initcap(trim(last_name)) AS last_name
            - lower(trim(email)) AS email
            - created_at
            - _ingested_at
            - _source_file
            - _rescued_data
          expectations:
            warn:
              valid_email_shape: "email IS NULL OR email LIKE '%@%'"
            drop:
              customer_id_present: customer_id IS NOT NULL
            fail: {}
    job:
      resource_key: customers_pipeline_schedule
      display_name: Customers ingestion schedule
      schedule:
        quartz_cron_expression: "0 0 * * * ?"
        timezone_id: Europe/London

  - name: orders_ingestion
    pipeline:
      resource_key: orders_pipeline
      display_name: Orders ingestion
      tables:
        bronze:
          name: bronze_orders
          type: streaming_table
          description: Raw customer order records
          source:
            path: orders
            schema_hints: order_id STRING, customer_id STRING, product_id STRING, order_timestamp TIMESTAMP, quantity INT, amount DECIMAL(12,2), status STRING
            options:
              cloudFiles.includeExistingFiles: true
              cloudFiles.schemaEvolutionMode: addNewColumns
        silver:
          name: silver_orders
          type: streaming_table
          description: Cleansed customer order data
          reads_from: bronze_orders
          select:
            - trim(order_id) AS order_id
            - trim(customer_id) AS customer_id
            - trim(product_id) AS product_id
            - order_timestamp
            - quantity
            - amount
            - upper(trim(status)) AS status
            - _ingested_at
            - _source_file
            - _rescued_data
          expectations:
            warn:
              known_order_status: "status IN ('PENDING', 'SHIPPED', 'COMPLETE', 'CANCELLED')"
            drop:
              order_id_present: order_id IS NOT NULL
              customer_id_present: customer_id IS NOT NULL
              product_id_present: product_id IS NOT NULL
              positive_quantity: quantity IS NOT NULL AND quantity > 0
              non_negative_amount: amount IS NOT NULL AND amount >= 0
            fail: {}
    job:
      resource_key: orders_pipeline_schedule
      display_name: Orders ingestion schedule
      schedule:
        quartz_cron_expression: "0 15 */4 * * ?"
        timezone_id: Europe/London

  - name: products_ingestion
    pipeline:
      resource_key: products_pipeline
      display_name: Products ingestion
      tables:
        bronze:
          name: bronze_products
          type: streaming_table
          description: Raw product catalogue records
          source:
            path: products
            schema_hints: product_id STRING, product_name STRING, category STRING, unit_price DECIMAL(12,2), active BOOLEAN
            options:
              cloudFiles.includeExistingFiles: true
              cloudFiles.schemaEvolutionMode: addNewColumns
        silver:
          name: silver_products
          type: streaming_table
          description: Cleansed product catalogue data
          reads_from: bronze_products
          select:
            - trim(product_id) AS product_id
            - trim(product_name) AS product_name
            - upper(trim(category)) AS category
            - unit_price
            - coalesce(active, true) AS active
            - _ingested_at
            - _source_file
            - _rescued_data
          expectations:
            warn:
              category_present: category IS NOT NULL
            drop:
              product_id_present: product_id IS NOT NULL
              non_negative_unit_price: unit_price IS NOT NULL AND unit_price >= 0
            fail: {}
    job:
      resource_key: products_pipeline_schedule
      display_name: Products ingestion schedule
      schedule:
        quartz_cron_expression: "0 30 2 * * ?"
        timezone_id: Europe/London
